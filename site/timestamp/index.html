<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timestamp Converter · Homelab Tools</title>
  <meta name="description" content="Convert Unix timestamps in seconds, milliseconds, microseconds or nanoseconds to ISO 8601, RFC 2822 and local time in any time zone, and back.">
  <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="/assets/theme-init.js"></script>
  <script type="module" src="/assets/shell.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body data-tool="timestamp">
  <header data-shell-header></header>

  <main class="page container">
    <nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav>
    <div class="tool-head">
      <span data-tool-icon></span>
      <div>
        <h1>Timestamp Converter</h1>
        <p class="lede">Paste a Unix timestamp or a date. The unit is detected from the number of digits, and nanosecond precision is kept.</p>
      </div>
    </div>

    <div class="sections">
      <section class="panel">
        <div class="panel-head">
          <h2>Right now</h2>
          <button class="btn" type="button" id="use-now"><span data-icon="clock"></span>Convert now</button>
        </div>
        <div class="panel-body big-now">
          <div>
            <div class="big" id="now-s">0</div>
            <div class="unit">Unix seconds</div>
          </div>
          <button class="btn btn-ghost btn-icon" type="button" id="copy-now-s" aria-label="Copy Unix seconds" title="Copy"><span data-icon="copy"></span></button>
          <div>
            <div class="big" id="now-ms">0</div>
            <div class="unit">Milliseconds</div>
          </div>
          <button class="btn btn-ghost btn-icon" type="button" id="copy-now-ms" aria-label="Copy milliseconds" title="Copy"><span data-icon="copy"></span></button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-body stack">
          <label class="visually-hidden" for="input">Timestamp or date</label>
          <input class="input input-mono input-lg w-full" id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
            placeholder="1793284200, 1793284200000, 2026-10-29T14:30:00Z, or now">
          <div class="row-flex">
            <label class="inline-field">Unit
              <select class="select" id="unit"></select>
            </label>
            <label class="inline-field grow">Time zone
              <select class="select grow" id="tz"></select>
            </label>
            <label class="inline-field">Pick
              <input class="input" type="datetime-local" id="picker" step="1" aria-label="Pick a date and time">
            </label>
          </div>
        </div>
        <div class="panel-body messages" id="messages"></div>
        <div class="rows" id="rows"></div>
      </section>
    </div>
  </main>

  <footer data-shell-footer></footer>
</body>
</html>
