# Tests, then builds the image for amd64, arm64 and arm/v7 and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/wolfes-homelab-tools.
#
#   push to main      → :latest and :sha-<commit>
#   tag v1.2.3        → :1.2.3, :1.2 and :1, then a GitHub release whose notes
#                       are that version's section of CHANGELOG.md
#   pull request      → test and build only, nothing is published
#
# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot
# keeps them current.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      # A release tag must match package.json and have a CHANGELOG.md entry,
      # so a mistyped tag fails here, before anything is published.
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG doesn't match package.json version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU needed: the final stage has no RUN steps (see Dockerfile).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io shows a multi-arch image's description from the index
      # annotations, not from labels, so write both.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=Homelab Tools
            org.opencontainers.image.description=Offline, private browser utilities for the homelab, served by static-web-server
            org.opencontainers.image.licenses=LicenseRef-MIT-Commons-Clause AND GPL-3.0-only
          annotations: |
            org.opencontainers.image.title=Homelab Tools
            org.opencontainers.image.description=Offline, private browser utilities for the homelab, served by static-web-server
            org.opencontainers.image.licenses=LicenseRef-MIT-Commons-Clause AND GPL-3.0-only

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          printf '\n**Docker image:** `docker pull ghcr.io/%s:%s`\n' "${GITHUB_REPOSITORY,,}" "$version" >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
